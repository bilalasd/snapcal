name: Loggi
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.0.0
options:
  bundleIdPrefix: com.loggi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: L8GMK24E8Q
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  Loggi:
    type: application
    platform: iOS
    sources: [Loggi]
    info:
      path: Loggi/Info.plist
      properties:
        CFBundleDisplayName: Loggi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.loggi.app
            CFBundleURLSchemes: [loggi]
        NSCameraUsageDescription: Loggi uses the camera to photograph your meals and scan barcodes so it can work out what you ate.
        NSPhotoLibraryUsageDescription: Loggi lets you pick a photo of your meal from your library instead of taking a new one.
        NSMicrophoneUsageDescription: Loggi can transcribe a spoken description of your meal.
        NSSpeechRecognitionUsageDescription: Loggi transcribes what you say about a meal so you can log it without typing.
        NSHealthShareUsageDescription: Loggi reads your weight from Apple Health so your trend stays current without manual entry.
        NSHealthUpdateUsageDescription: Loggi writes the weigh-ins you log to Apple Health.
    entitlements:
      path: Loggi/Loggi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.loggi.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loggi.app
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: LoggiWidgets
        embed: true
      - target: LoggiIntents
        embed: true
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI

  LoggiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LoggiTests
      - path: Loggi.storekit
        buildPhase: resources
    dependencies:
      - target: Loggi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loggi.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Loggi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Loggi"
        BUNDLE_LOADER: "$(TEST_HOST)"

  LoggiWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [LoggiWidgets]
    info:
      path: LoggiWidgets/Info.plist
      properties:
        CFBundleDisplayName: LoggiWidgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LoggiWidgets/LoggiWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.loggi.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loggi.app.widget
        TARGETED_DEVICE_FAMILY: "1"

  LoggiIntents:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [LoggiIntents]
    info:
      path: LoggiIntents/Info.plist
      properties:
        CFBundleDisplayName: LoggiIntents
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.appintents-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loggi.app.appintents
        TARGETED_DEVICE_FAMILY: "1"
        # AppIntents' `title`/`description`/`openAppWhenRun` static properties
        # aren't Sendable-annotated in this SDK; Swift 6 strict concurrency
        # rejects them. Swift 5 mode restores the checking level the RN/bacons
        # project actually compiled these files under. Ported code unchanged.
        SWIFT_VERSION: "5.0"

schemes:
  Loggi:
    build:
      targets:
        Loggi: all
    run:
      config: Debug
      # Local StoreKit testing — real products in the simulator, no App Store
      # Connect. Removed for a real archive, which uses live products.
      storeKitConfiguration: Loggi.storekit
    test:
      config: Debug
      targets:
        - LoggiTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
